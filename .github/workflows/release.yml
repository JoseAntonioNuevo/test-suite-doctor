name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: Pinned release benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Reproduce all pinned benchmarks, including Remeda
        run: node --import tsx tools/run-benchmarks.ts --target all --out benchmark-results
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-benchmarks-${{ github.sha }}
          path: benchmark-results/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish tested tarball
    needs: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write # create the GitHub release and attach exact artifacts
      id-token: write # registry trusted publishing provenance
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build && git diff --exit-code -- dist/cli.mjs
      - name: Validate tag and package version
        run: |
          node -e "const p=require('./package.json'); const tag=process.env.GITHUB_REF_NAME; if(!/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(tag) || tag !== 'v'+p.version) process.exit(1)"
      - name: Pack the tested artifact once
        id: pack
        run: |
          TARBALL=$(pnpm --config.ignore-scripts=true pack --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).filename))")
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
      - run: pnpm run typecheck
      - name: Test the exact tarball selected for publication
        env:
          TEST_SUITE_DOCTOR_TARBALL: ${{ github.workspace }}/${{ steps.pack.outputs.tarball }}
        run: pnpm test
      - name: Create checksum and SBOM for the tested tarball
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          sha256sum "$TARBALL" > "$TARBALL.sha256"
          pnpm sbom --prod --sbom-format cyclonedx > "$TARBALL.sbom.cdx.json"
      - name: Publish exact tarball with OIDC provenance when absent
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if pnpm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published"
          else
            pnpm publish "$TARBALL" --access public
          fi
      - name: Create or update idempotent GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          gh release upload "$TAG" "$TARBALL" "$TARBALL.sha256" "$TARBALL.sbom.cdx.json" --clobber --repo "$GITHUB_REPOSITORY"
