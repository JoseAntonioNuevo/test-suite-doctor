name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Demo pipeline smoke test
        run: |
          npx tsx examples/make-demo.ts
          npx tsx scripts/minimize.ts --report examples/demo-report.json \
            --out-plan /tmp/demo-plan.json --out-md /tmp/demo-plan.md \
            --coverage-floor 0.97 --keep regression
          node -e "const p=require('/tmp/demo-plan.json'); if(p.summary.lineRetention<0.97) process.exit(1)"
